<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Eat The Rich</title>
    <style>
      html, body {
        background: #231F20;
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
        overflow: hidden;
      }
      #unity-container {
        width: 100%;
        height: 100%;
        position: absolute;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        background: #231F20;
        display: block;
      }
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: #ffffff;
        font-family: sans-serif;
        text-align: center;
      }
      #unity-progress-bar-empty {
        width: 200px;
        height: 10px;
        background: rgba(255, 255, 255, 0.2);
        margin-top: 10px;
        border-radius: 5px;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #ffffff;
        border-radius: 5px;
        transition: width 0.2s;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo">Loading...</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>

    <!-- Unity Loader Script (Usually found inside your Build folder) -->
    <script src="Build/UnityLoader.js"></script>
    <script>
      // Configuration built from your project parameters
      var unityInstance = UnityLoader.instantiate("unity-canvas", "Build/EatTheRichPort.json", {
        onProgress: UnityProgress
      });

      function UnityProgress(unityInstance, progress) {
        if (!unityInstance.Module) return;
        
        const loadingBar = document.getElementById("unity-loading-bar");
        const progressBarFull = document.getElementById("unity-progress-bar-full");
        
        progressBarFull.style.width = (100 * progress) + "%";
        
        if (progress === 1 && !unityInstance.Module.loadingDone) {
          unityInstance.Module.loadingDone = true;
          loadingBar.style.display = "none";
        }
      }
    </script>
  </body>
</html>
